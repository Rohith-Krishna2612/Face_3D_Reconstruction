api:
  debug: true
  host: 0.0.0.0
  port: 8000
dataset:
  max_train_samples: 10000
  max_val_samples: 1000
  name: FFHQ
  path: ./data/ffhq
  resolution: 256
  train_split: 0.9
  val_split: 0.1
degradations:
  blur:
    kernel_sizes:
    - 15
    - 21
    - 25
    sigma_range:
    - 0.1
    - 3.0
  downsampling:
    scale_factors:
    - 2
    - 4
    - 8
  gaussian_noise:
    noise_range:
    - 0
    - 50
  jpeg_compression:
    quality_range:
    - 10
    - 95
model:
  code_dim: 256
  codebook_size: 512
  dim: 256
  input_size:
  - 256
  - 256
  name: CodeFormer
  num_channels: 3
paths:
  checkpoints: ./checkpoints
  data: ./data
  logs: ./logs
  models: ./models
  output: ./output
project_name: Face_3D_Reconstruction
training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  mixed_precision: true
  num_epochs: 100
  num_workers: 2
  save_freq: 5
  val_freq: 2
  weight_decay: 0.0001
version: 1.0.0
